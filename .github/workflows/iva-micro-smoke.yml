name: IVA Micro data-and-training smoke run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import only reviewed lexical datasets
        run: python import_datasets.py --only assoc_safe kartaslovsent
      - name: Convert lexical annotations to attributed Russian examples
        run: python prepare_auxiliary_text.py --assoc-csv data/imported/assoc_safe.csv --sentiment-csv data/imported/kartaslovsent.csv
      - name: Train tiny CPU diagnostic model
        run: python train.py --config configs/iva_micro_smoke.yaml --data-dir data/raw --manifest data/manifest.json --out-dir checkpoints
      - name: Generate a diagnostic continuation
        run: |
          python generate.py --checkpoint checkpoints/artifacts/iva_micro_checkpoint.pt --tokenizer checkpoints/iva_micro_smoke.model --prompt "Слово «кот» вызывает ассоциацию" --max-new-tokens 30 --device cpu | tee checkpoints/artifacts/generation_sample.txt
      - name: Capture Cloudflare API status
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://iva-ai-studio.olgakolina71.workers.dev/api/status"
          result = {"ok": False, "url": url}
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  result = {"ok": True, "http_status": response.status, "data": json.load(response)}
          except urllib.error.HTTPError as error:
              result.update({"http_status": error.code, "error": "Cloudflare returned an HTTP error"})
          except (urllib.error.URLError, TimeoutError) as error:
              result.update({"error": "Cloudflare status request failed", "reason": str(error.reason if hasattr(error, "reason") else error)})

          with open("checkpoints/artifacts/cloudflare_worker_status.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iva-micro-smoke-artifacts
          path: |
            checkpoints/artifacts/
            checkpoints/iva_micro_smoke.model
            data/manifest.json
          retention-days: 7
