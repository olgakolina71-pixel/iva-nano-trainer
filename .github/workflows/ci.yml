name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q iva_nano train.py generate.py chat.py serve.py evaluate.py import_datasets.py import_hf_datasets.py prepare_auxiliary_text.py prepare_sft.py prepare_candidate_corpus.py collect_wikipedia.py preflight_iva.py audit_candidate_corpus.py tests
      - name: Run importer tests
        run: python -m unittest discover -s tests -v
      - name: Check model forward pass
        run: |
          python - <<'PY'
          import torch
          from iva_nano.model import IVANano
          cfg = {
              "vocab_size": 128, "context_length": 32, "d_model": 64,
              "n_layers": 2, "n_heads": 4, "mlp_ratio": 4,
              "dropout": 0.0, "tie_embeddings": True
          }
          model = IVANano(cfg)
          x = torch.randint(0, 128, (2, 16))
          y = torch.randint(0, 128, (2, 16))
          logits, loss = model(x, y)
          assert logits.shape == (2, 16, 128)
          assert loss is not None and torch.isfinite(loss)
          print("CPU model smoke test passed")
          PY

      - name: Verify IVA Nano parameter target
        run: |
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("configs/iva_nano_40m.yaml", encoding="utf-8"))
          m = cfg["model"]
          d, v, ctx = m["d_model"], m["vocab_size"], m["context_length"]
          layers, ratio = m["n_layers"], m["mlp_ratio"]
          params = v*d + ctx*d + layers*(4*d*d + 8*d*d + 9*d) + 2*d
          if not m.get("tie_embeddings", True):
              params += v*d
          assert params == 40_015_008, params
          print(f"IVA Nano parameter target verified: {params:,}")
          PY
