name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q iva_nano train.py generate.py import_datasets.py prepare_auxiliary_text.py tests
      - name: Run importer tests
        run: python -m unittest discover -s tests -v
      - name: Check model forward pass
        run: |
          python - <<'PY'
          import torch
          from iva_nano.model import IVANano
          cfg = {
              "vocab_size": 128, "context_length": 32, "d_model": 64,
              "n_layers": 2, "n_heads": 4, "mlp_ratio": 4,
              "dropout": 0.0, "tie_embeddings": True
          }
          model = IVANano(cfg)
          x = torch.randint(0, 128, (2, 16))
          y = torch.randint(0, 128, (2, 16))
          logits, loss = model(x, y)
          assert logits.shape == (2, 16, 128)
          assert loss is not None and torch.isfinite(loss)
          print("CPU model smoke test passed")
          PY
