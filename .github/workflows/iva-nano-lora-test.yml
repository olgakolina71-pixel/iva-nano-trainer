name: IVA Nano — compare base and LoRA

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: "Run ID containing the base IVA Nano checkpoint"
        required: true
        default: "44093760271"
        type: string
      lora_run_id:
        description: "Run ID containing the LoRA adapter"
        required: true
        default: "44783312219"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compare-base-and-lora:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download base checkpoint and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: iva-nano-first-training-checkpoint
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .

      - name: Download trained LoRA adapter
        uses: actions/download-artifact@v4
        with:
          name: iva-nano-lora-sft-100-steps
          run-id: ${{ inputs.lora_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: lora

      - name: Verify files
        run: |
          set -euo pipefail
          test -s checkpoints/artifacts/iva_nano_40m_checkpoint.pt
          test -s checkpoints/iva_tokenizer.model
          test -s lora/adapter_model.safetensors
          test -s lora/adapter_config.json

      - name: Compare base model and LoRA on exact training prompts
        shell: bash
        run: |
          set -euo pipefail

          prompts=(
            $'### Пользователь:\nПривет! Кто ты и как тебя зовут?\n### IVA:\n'
            $'### Пользователь:\nКак тебя зовут?\n### IVA:\n'
            $'### Пользователь:\nСколько будет 2+2?\n### IVA:\n'
          )
          labels=("Кто ты и как тебя зовут?" "Как тебя зовут?" "Сколько будет 2+2?")
          expected=(
            "Привет! Я IVA — небольшая языковая модель, созданная в рамках проекта IVA. Я учусь отвечать на вопросы и помогать в диалоге."
            "Меня зовут IVA. Я ИИ-модель проекта IVA Nano."
            "2 + 2 = 4."
          )

          : > iva-base-vs-lora.txt
          for i in 0 1 2; do
            {
              printf '## Вопрос: %s\n' "${labels[$i]}"
              printf 'Эталон из обучающего примера: %s\n\n' "${expected[$i]}"
            } | tee -a iva-base-vs-lora.txt

            for variant in base lora; do
              adapter_args=()
              if [[ "$variant" == "lora" ]]; then
                adapter_args+=(--lora-adapter lora)
              fi

              printf '### %s\n' "$variant" | tee -a iva-base-vs-lora.txt
              python generate.py \
                --checkpoint checkpoints/artifacts/iva_nano_40m_checkpoint.pt \
                --tokenizer checkpoints/iva_tokenizer.model \
                "${adapter_args[@]}" \
                --prompt "${prompts[$i]}" \
                --max-new-tokens 48 \
                --temperature 1.0 \
                --top-k 1 \
                --top-p 1.0 \
                --repetition-penalty 1.12 \
                --device cpu 2>&1 | tee -a iva-base-vs-lora.txt
              echo | tee -a iva-base-vs-lora.txt
            done
          done

      - name: Publish comparison in summary
        if: always()
        run: |
          {
            echo "## IVA Nano — сравнение base и LoRA"
            echo
            if [ -s iva-base-vs-lora.txt ]; then
              cat iva-base-vs-lora.txt
            else
              echo "No output generated; inspect logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison artifact
        if: always() && hashFiles('iva-base-vs-lora.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iva-nano-base-vs-lora-${{ github.run_number }}
          path: iva-base-vs-lora.txt
          retention-days: 7
