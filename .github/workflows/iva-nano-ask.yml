name: IVA Nano — ask a question

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Вопрос для IVA"
        required: true
        default: "Привет! Как тебя зовут, кто тебя создал и для чего ты существуешь?"
        type: string
      checkpoint_run_id:
        description: "GitHub Actions run ID, где сохранён checkpoint IVA Nano"
        required: true
        default: "44093760271"
        type: string
      max_new_tokens:
        description: "Максимальная длина ответа (1–160)"
        required: true
        default: "100"
        type: string
      temperature:
        description: "Температура генерации (0.1–1.5)"
        required: true
        default: "0.7"
        type: string
      repetition_penalty:
        description: "Штраф повторений (1.0–1.4)"
        required: true
        default: "1.12"
        type: string
      top_p:
        description: "Nucleus sampling (0.1–1.0)"
        required: true
        default: "0.9"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  ask-iva:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inference dependencies
        run: python -m pip install --upgrade pip && python -m pip install torch sentencepiece

      - name: Download IVA Nano checkpoint and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: iva-nano-first-training-checkpoint
          run-id: ${{ inputs.checkpoint_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .

      - name: Verify model files
        run: |
          set -euo pipefail
          test -s checkpoints/artifacts/iva_nano_40m_checkpoint.pt
          test -s checkpoints/iva_tokenizer.model
          ls -lh checkpoints/artifacts/iva_nano_40m_checkpoint.pt checkpoints/iva_tokenizer.model

      - name: Ask IVA
        env:
          IVA_PROMPT: ${{ inputs.prompt }}
          IVA_MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
          IVA_TEMPERATURE: ${{ inputs.temperature }}
          IVA_REPETITION_PENALTY: ${{ inputs.repetition_penalty }}
          IVA_TOP_P: ${{ inputs.top_p }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          value = int(os.environ["IVA_MAX_NEW_TOKENS"])
          temperature = float(os.environ["IVA_TEMPERATURE"])
          repetition_penalty = float(os.environ["IVA_REPETITION_PENALTY"])
          top_p = float(os.environ["IVA_TOP_P"])
          if not 1 <= value <= 160:
              raise SystemExit("max_new_tokens must be between 1 and 160")
          if not 0.1 <= temperature <= 1.5:
              raise SystemExit("temperature must be between 0.1 and 1.5")
          if not 1.0 <= repetition_penalty <= 1.4:
              raise SystemExit("repetition_penalty must be between 1.0 and 1.4")
          if not 0.1 <= top_p <= 1.0:
              raise SystemExit("top_p must be between 0.1 and 1.0")
          PY
          python generate.py \
            --checkpoint checkpoints/artifacts/iva_nano_40m_checkpoint.pt \
            --tokenizer checkpoints/iva_tokenizer.model \
            --prompt "$IVA_PROMPT" \
            --max-new-tokens "$IVA_MAX_NEW_TOKENS" \
            --temperature "$IVA_TEMPERATURE" \
            --repetition-penalty "$IVA_REPETITION_PENALTY" \
            --top-p "$IVA_TOP_P" \
            --report-stats \
            --device cpu | tee iva-answer.txt

      - name: Publish answer in the run summary
        if: always()
        run: |
          {
            echo "## Ответ IVA Nano"
            echo
            if [ -s iva-answer.txt ]; then
              cat iva-answer.txt
            else
              echo "Генерация не завершилась. Проверьте журнал предыдущего шага."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save answer as an artifact
        if: always() && hashFiles('iva-answer.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iva-nano-answer-${{ github.run_number }}
          path: iva-answer.txt
          retention-days: 7
