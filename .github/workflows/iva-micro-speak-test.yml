name: IVA Micro — live speech check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iva-micro-speak-test.yml"

permissions:
  contents: read
  actions: read

jobs:
  speak-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download existing IVA Micro checkpoint
        uses: actions/download-artifact@v4
        with:
          name: iva-micro-smoke-artifacts
          run-id: 43850276928
          github-token: ${{ github.token }}
          path: micro-artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch sentencepiece

      - name: Generate answers with IVA itself
        run: |
          python generate_iva_micro_answers.py \
            --checkpoint micro-artifact/checkpoints/artifacts/iva_micro_checkpoint.pt \
            --tokenizer micro-artifact/checkpoints/iva_micro_smoke.model \
            --output data/academy/iva_speech_test.jsonl

      - name: Show IVA answers in the run log
        run: |
          echo "=== REAL IVA MICRO OUTPUTS (not evaluator text) ==="
          cat data/academy/iva_speech_test.jsonl

      - name: Save answers as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: iva-speech-test-${{ github.run_number }}
          path: data/academy/iva_speech_test.jsonl
          if-no-files-found: error
          retention-days: 14
