name: IVA Nano — unseen prompt generalization test

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: "Run ID containing the original base checkpoint"
        required: true
        default: "44093760271"
        type: string
      diagnostic_run_id:
        description: "Run ID containing the 10-dialogue LoRA adapter"
        required: true
        default: "44798488698"
        type: string
      adapter_artifact_name:
        description: "Exact name of the diagnostic adapter artifact"
        required: true
        default: "iva-nano-10-dialogue-diagnostic-1"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inference-only-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download original base checkpoint
        uses: actions/download-artifact@v4
        with:
          name: iva-nano-first-training-checkpoint
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: base-checkpoint

      - name: Download diagnostic LoRA adapter
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.adapter_artifact_name }}
          run-id: ${{ inputs.diagnostic_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: adapter-artifact

      - name: Verify files
        run: |
          set -euo pipefail
          test -s base-checkpoint/checkpoints/artifacts/iva_nano_40m_checkpoint.pt
          test -s base-checkpoint/checkpoints/iva_tokenizer.model
          test -s adapter-artifact/diagnostic-lora/adapter_config.json
          test -s adapter-artifact/diagnostic-lora/adapter_model.safetensors

      - name: Run unseen prompts without training
        run: |
          set -euo pipefail
          python test_generalization.py \
            --checkpoint base-checkpoint/checkpoints/artifacts/iva_nano_40m_checkpoint.pt \
            --tokenizer base-checkpoint/checkpoints/iva_tokenizer.model \
            --adapter adapter-artifact/diagnostic-lora \
            --output generalization_report.json 2>&1 | tee generalization.log

      - name: Publish report
        if: always()
        run: |
          {
            echo "## IVA Nano — проверка новых вопросов (без обучения)"
            if [ -f generalization_report.json ]; then
              cat generalization_report.json
            elif [ -f generalization.log ]; then
              tail -n 100 generalization.log
            else
              echo "No inference output. Inspect job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inference report
        if: always() && hashFiles('generalization.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iva-nano-generalization-report-${{ github.run_number }}
          path: |
            generalization.log
            generalization_report.json
          retention-days: 7
