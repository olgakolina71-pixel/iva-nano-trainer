name: IVA AI Academy (evaluate IVA answers)

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Repository path to a JSONL file with question and iva_answer fields"
        required: true
        default: "data/academy/iva_answers.jsonl"
        type: string
      limit:
        description: "Maximum number of IVA answers to evaluate"
        required: true
        default: "20"
        type: choice
        options:
          - "5"
          - "10"
          - "20"
          - "50"
          - "100"

permissions:
  contents: read

jobs:
  evaluate-iva:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate IVA answers with independent teachers
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${{ secrets.OVH_AI_ENDPOINTS_ACCESS_TOKEN }}
        run: |
          python evaluate_iva.py --input "${{ inputs.input_path }}" --limit "${{ inputs.limit }}"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iva-answer-evaluation-${{ github.run_number }}
          path: data/academy/evaluation_report.json
          if-no-files-found: warn
          retention-days: 7
