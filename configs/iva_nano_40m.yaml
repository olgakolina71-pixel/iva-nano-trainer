model_id: iva-nano-40m
model:
  vocab_size: 24000
  context_length: 1024
  d_model: 528
  n_layers: 8
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  tie_embeddings: true

tokenizer:
  model_prefix: iva_tokenizer
  vocab_size: 24000
  model_type: bpe

training:
  checkpoint_name: iva_nano_40m_checkpoint.pt
  seed: 42
  batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 50000
  minimum_training_tokens: 100000000
  target_training_tokens: 800000000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  warmup_steps: 2000
  eval_interval: 500
  save_interval: 2500
  max_grad_norm: 1.0
  num_workers: 2
  device: auto
