model:
  vocab_size: 24000
  context_length: 1024
  d_model: 512
  n_layers: 8
  n_heads: 8
  mlp_ratio: 4
  dropout: 0.0
  tie_embeddings: true

tokenizer:
  model_prefix: iva_tokenizer
  vocab_size: 24000
  model_type: bpe

training:
  seed: 42
  batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 1000
  minimum_training_tokens: 1000000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  warmup_steps: 50
  eval_interval: 100
  save_interval: 250
  max_grad_norm: 1.0
  num_workers: 0
  device: auto
