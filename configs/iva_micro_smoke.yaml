model_id: iva-micro-smoke
model:
  vocab_size: 1024
  context_length: 128
  d_model: 64
  n_layers: 2
  n_heads: 4
  mlp_ratio: 4
  dropout: 0.05
  tie_embeddings: true

tokenizer:
  model_prefix: iva_micro_smoke
  vocab_size: 1024
  model_type: bpe

training:
  checkpoint_name: iva_micro_checkpoint.pt
  seed: 42
  batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 20
  minimum_training_tokens: 1
  learning_rate: 0.0005
  min_learning_rate: 0.00005
  weight_decay: 0.1
  warmup_steps: 2
  eval_interval: 5
  save_interval: 10
  max_grad_norm: 1.0
  num_workers: 0
  device: cpu
